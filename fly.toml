# fly.toml app configuration file generated for tel-uploader-bot on 2026-11-07T01:37:59Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'tel-uploader-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10
